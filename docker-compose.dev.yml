# 本地源码开发 override（必须与 docker-compose.yml 一起使用）
#
# 作用：
# 1. 把 MySQL/Redis 映射到宿主机 127.0.0.1:3307/6380，供宿主机上的 Python 服务连接
# 2. 使用独立的 dev 数据卷，避免和全量 Docker 部署的 mysql_data/redis_data 混用
#
# 只起基础设施（Python/前端在宿主机跑）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mysql redis
#
# 全量 Docker（应用也进容器）：
#   本机 8090 被 nginx 占用，必须显式指定 WEBSOCKET_PORT=18090：
#   WEBSOCKET_PORT=18090 docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 停止：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
# 清空 dev 数据：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
#
# 注意：MySQL/Redis 账号密码沿用 docker-compose.yml 的默认值（xianyu@2026），
# backend-web/.env.dev、websocket/.env.dev、scheduler/.env.dev 必须保持一致。

services:
  mysql:
    # 只绑定 127.0.0.1，避免把 dev 数据库暴露到局域网
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3307}:3306"
    # 覆盖基础 compose 的 mysql_data，dev 使用独立数据卷
    volumes:
      - mysql_dev_data:/var/lib/mysql

  redis:
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
